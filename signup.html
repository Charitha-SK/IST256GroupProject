<!DOCTYPE html>
<html lang="en">
<!-- SIGN UP SHEET -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">
    <title>Daily Digest - Sign Up</title>
</head>

<body>

    <h1>Daily Digest</h1>
    <p>Your daily dose of news, stories, and inspiration.</p>

    <nav class="home-navbar" aria-label="Main menu">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="signup.html">Sign Up</a></li>
        </ul>
    </nav>

    <main class="container mt-4">
        <h2>Create Your Account</h2>
        <p>Join Daily Digest to become a member!</p>

        <form id="signupForm" class="col-md-6">
            <div class="mb-3">
                <label class="form-label" for="name">Full Name:</label>
                <input class="form-control" type="text" id="name" name="name" required>
            </div>

            <div class="mb-3">
                <label class="form-label" for="age">Age:</label>
                <input class="form-control" type="number" id="age" name="age" min="13" max="120" required>
            </div>

            <div class="mb-3">
                <label class="form-label" for="email">Email:</label>
                <input class="form-control" type="email" id="email" name="email" required>
            </div>

            <div class="mb-3">
                <label class="form-label" for="phone">Phone (optional):</label>
                <input class="form-control" type="tel" id="phone" name="phone">
            </div>

            <div class="mb-3">
                <label class="form-label" for="address">Address:</label>
                <input class="form-control" type="text" id="address" name="address" required>
            </div>

            <button class="btn btn-primary" type="submit" id="submitBtn">Sign Up</button>
        </form>

        <p id="message"></p>

        <h2>Members</h2>
        <div id="memberList"></div>
        <h3>Saved as JSON</h3>
        <pre id="jsonBox">[]</pre>
        <button class="btn btn-secondary" type="button" id="downloadBtn">Download members.json</button>
    </main>

    <footer>
        <p>&copy; 2026 Daily Digest</p>
    </footer>
<!-- END SIGN UP SHEET -->

    <script src="signup.js"></script>
</body>
</html>
